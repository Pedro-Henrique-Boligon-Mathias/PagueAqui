  eslint-config-next: ^15.3.4
  eslint-config-prettier: ^10.1.5
  typescript: ^5.8.3
  typescript-eslint: ^8.35.0
  vitest: ^3.2.4

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  postcss: 8.5.15
